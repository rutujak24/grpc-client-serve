version: '3.8'

services:
  # Key-Value Storage gRPC Service
  kv-service:
    build:
      context: .
      dockerfile: docker/kv-service/Dockerfile
    container_name: kv-service
    environment:
      - KV_SERVICE_PORT=:50051
    ports:
      - "50051:50051"
    networks:
      - kvstore-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # REST API Service
  api-service:
    build:
      context: .
      dockerfile: docker/api-service/Dockerfile
    container_name: api-service
    environment:
      - API_SERVICE_PORT=:8080
      - KV_SERVICE_ADDR=kv-service:50051
    ports:
      - "8081:8080"
    networks:
      - kvstore-network
    depends_on:
      kv-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  kvstore-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

